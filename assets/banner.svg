<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.6; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
    }
    @keyframes pulseRating {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 12px rgba(129, 140, 248, 0.8)); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    .orb-1 { animation: pulseOrb 12s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 16s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    .card-float-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-float-2 { animation: floatCard2 7s ease-in-out infinite; }
    .rating-pulse { animation: pulseRating 4s ease-in-out infinite; transform-origin: center; }
    .connecting-path {
      stroke-dasharray: 8, 8;
      animation: flowLine 25s linear infinite;
    }
    
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .body-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambient Orbs (Background layer) -->
  <g filter="url(#softGlow)">
    <circle class="orb-1" cx="220" cy="120" r="140" fill="#38bdf8" />
    <circle class="orb-2" cx="980" cy="280" r="160" fill="#a855f7" />
    <circle cx="600" cy="380" r="120" fill="#4338ca" opacity="0.4" />
  </g>

  <!-- Geometric Grid Pattern Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Background Decorative Dynamic Flow Line -->
  <path class="connecting-path" d="M -50 320 Q 300 240 600 310 T 1250 250" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" />
  <path class="connecting-path" d="M -50 180 Q 400 120 750 200 T 1250 120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Background Decorative Dynamic Cards (Subtle & strictly in background) -->
  <g class="card-float-1" opacity="0.75">
    <rect x="75" y="55" width="220" height="70" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="105" cy="90" r="16" fill="#10b981" fill-opacity="0.2" />
    <text x="105" y="95" text-anchor="middle" font-size="16" fill="#10b981">★</text>
    <text class="body-text" x="135" y="83" font-size="12" font-weight="600" fill="#e2e8f0">NPS Score: +74</text>
    <text class="body-text" x="135" y="101" font-size="10" fill="#94a3b8">World Class CX</text>
  </g>

  <g class="card-float-2" opacity="0.75">
    <rect x="910" y="65" width="215" height="70" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="940" cy="100" r="16" fill="#6366f1" fill-opacity="0.2" />
    <text x="940" y="106" text-anchor="middle" font-size="15" fill="#818cf8">📊</text>
    <text class="body-text" x="970" y="93" font-size="12" font-weight="600" fill="#e2e8f0">CSAT: 98.4%</text>
    <text class="body-text" x="970" y="111" font-size="10" fill="#94a3b8">Customer Effort: Low</text>
  </g>

  <!-- Clear Center Container / Glow Frame for High Contrast Forefront Readability -->
  <g>
    <!-- Dark Backplate for 100% Uncompromised Title/Subtitle Clarity -->
    <rect x="180" y="95" width="840" height="230" rx="20" fill="#090d16" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Top Category Pill Badge -->
    <g transform="translate(600, 130)">
      <rect x="-140" y="-15" width="280" height="30" rx="15" fill="url(#accentGrad)" opacity="0.35" />
      <rect x="-140" y="-15" width="280" height="30" rx="15" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.6" />
      <text class="body-text" x="0" y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="1.5">CURATED AWESOME STACK</text>
    </g>

    <!-- Foreground Main Title (Guaranteed Sharp Foreground) -->
    <text class="title-text" x="600" y="195" text-anchor="middle" font-size="36" fill="url(#primaryGrad)" filter="url(#glow)">
      Awesome Customer Satisfaction
    </text>
    <text class="title-text" x="600" y="240" text-anchor="middle" font-size="34" fill="#ffffff">
      &amp; Feedback Surveys
    </text>

    <!-- Foreground Subtitle -->
    <text class="body-text" x="600" y="285" text-anchor="middle" font-size="15" fill="#cbd5e1" font-weight="400">
      The definitive directory of SaaS &amp; Open-Source NPS, CSAT, CES, and In-App Feedback Platforms
    </text>
  </g>

  <!-- Interactive Rating Pill Bar at Bottom Foreground -->
  <g class="rating-pulse" transform="translate(600, 360)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
    <text class="body-text" x="0" y="5" text-anchor="middle" font-size="12" font-weight="600" fill="#94a3b8">
      🌟 Net Promoter Score (NPS) • 🎯 CSAT • ⚡ CES • 💻 In-Product Micro-Surveys
    </text>
  </g>

  <!-- Subtle Outer Border -->
  <rect x="0.5" y="0.5" width="1199" height="419" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.5" />
</svg>